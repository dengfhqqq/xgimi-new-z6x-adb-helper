name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run policy tests
        run: bash test.sh
      - name: Build and validate APK
        run: bash build.sh
      # The CI key is temporary. Signing material and passwords are not uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: Z6X-ADB-Helper-v1.6.0
          path: |
            dist/*.apk
            dist/SHA256SUMS
            build/v1.6.0/validation.txt
            build/policy-tests/result.txt
          if-no-files-found: error
